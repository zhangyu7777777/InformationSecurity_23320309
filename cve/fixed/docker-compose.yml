services:
  couchdb:
    image: couchdb:2.1.1
    ports:
      - "5985:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password

  init:
    image: buildpack-deps:focal-curl
    command: "bash /init.sh"
    environment:
      COUCHDB_URL: couchdb:5984
      COUCHDB_AUTH: admin:password
    volumes:
      - ./init.sh:/init.sh
    depends_on:
      - couchdb
