stages:
  - test
  - sast
  - sca

default:
  image: python:3.11
  interruptible: true
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir .cache/pip -r requirements-dev.txt

test:
  stage: test
  script:
    - pytest -q

bandit:
  stage: sast
  script:
    - mkdir -p reports
    - bandit -r app -f json -o reports/bandit.json
    - bandit -r app -f txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/bandit.json

pip-audit:
  stage: sca
  script:
    - mkdir -p reports
    - pip-audit -r requirements.txt -f json -o reports/pip-audit.json
    - pip-audit -r requirements.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/pip-audit.json
